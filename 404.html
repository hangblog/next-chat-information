<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际迷航 - 404</title>
    <meta name="referrer-policy" content="strict-origin-when-cross-origin">
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 星空容器 */
        .starfield {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        /* 内容容器 */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00f7ff;
        }

        p {
            font-size: 1.2em;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        /* 返回按钮 */
        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(45deg, #0011ff, #00f7ff);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 2px solid #00f7ff;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00f7ff;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 1em;
            height: 1em;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 星空动画 */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="starfield" id="starfield"></div>
        <div class="content">
            <h1>404 - 曲速引擎故障</h1>
            <p>我们似乎迷失在了星云中...</p>
            <a href="/" class="btn" id="backBtn" role="button" 
               aria-label="返回导航" tabindex="0">
                <span class="btn-text">返回地球基地</span>
            </a>
        </div>
    </div>

    <script>
        // 星空背景生成
        function createStarfield(containerId) {
            const container = document.getElementById(containerId);
            const starCount = 200;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.width = `${Math.random() * 3}px`;
                star.style.height = star.style.width;
                star.style.backgroundColor = '#fff';
                star.style.borderRadius = '50%';
                star.style.opacity = '0.3';
                star.style.animation = `twinkle ${2 + Math.random() * 3}s infinite`;
                container.appendChild(star);
            }
        }

        // 返回逻辑控制器
        class NavigationController {
            constructor(btnId) {
                this.backBtn = document.getElementById(btnId);
                this.btnText = this.backBtn.querySelector('.btn-text');
                this.isProcessing = false;
                this.init();
            }

            init() {
                this.backBtn.addEventListener('click', this.handleClick.bind(this));
                this.backBtn.addEventListener('keydown', this.handleKeyPress.bind(this));
            }

            handleClick(e) {
                e.preventDefault();
                this.executeNavigation();
            }

            handleKeyPress(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.executeNavigation();
                }
            }

            getValidReferrer() {
                try {
                    const referrer = document.referrer;
                    if (!referrer) return null;
                    
                    const currentOrigin = location.origin;
                    const referrerOrigin = new URL(referrer).origin;
                    
                    if (referrerOrigin === currentOrigin) return 'history';
                    if (!referrer.startsWith('http')) return null;
                    
                    return referrer;
                } catch {
                    return null;
                }
            }

            showLoading() {
                this.btnText.innerHTML = `<span class="loading"></span>曲速启动中...`;
                this.backBtn.style.pointerEvents = 'none';
                this.isProcessing = true;
            }

            resetButton() {
                this.btnText.textContent = '返回地球基地';
                this.backBtn.style.pointerEvents = 'auto';
                this.isProcessing = false;
            }

            executeNavigation() {
                if (this.isProcessing) return;
                
                this.showLoading();

                // 优先使用浏览器历史
                if (window.history.length > 1) {
                    window.history.back();
                    setTimeout(() => {
                        if (!document.hidden) {
                            window.location.href = '/';
                        }
                    }, 2000);
                    return;
                }

                // 次选referrer跳转
                const referrer = this.getValidReferrer();
                if (referrer && referrer !== 'history') {
                    if (confirm(`即将前往：${new URL(referrer).hostname}\n确定继续吗？`)) {
                        window.location.href = referrer;
                    } else {
                        window.location.href = '/';
                    }
                    return;
                }

                // 最终回退
                window.location.href = '/';
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 创建星空背景
            createStarfield('starfield');
            
            // 初始化返回控制器
            new NavigationController('backBtn');

            // 超时恢复机制
            setTimeout(() => {
                const btn = document.getElementById('backBtn');
                if (btn.style.pointerEvents === 'none') {
                    btn.querySelector('.btn-text').textContent = '返回地球基地';
                    btn.style.pointerEvents = 'auto';
                }
            }, 5000);
        });
    </script>
</body>
</html>
