<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航哥的404</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a043c;
            color: #fff;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .astronaut {
            width: 200px;
            height: 200px;
            position: relative;
            animation: float 4s ease-in-out infinite;
        }

        .astronaut::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: #fff;
            border-radius: 50%;
            top: 50px;
            left: 85px;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .astronaut-body {
            position: absolute;
            width: 100px;
            height: 150px;
            background: #e0e0e0;
            border-radius: 50px;
            top: 70px;
            left: 50px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin: 2rem 0;
            animation: glitch 2s infinite;
        }

        .message {
            font-size: 1.5rem;
            text-align: center;
            max-width: 600px;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 1rem 2rem;
            background: #00b4d8;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: #0077b6;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,180,216,0.4);
        }

        .planet {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #2d4263;
            border-radius: 50%;
            bottom: -150px;
            right: -100px;
            box-shadow: inset -25px -25px 40px rgba(0,0,0,0.5);
        }

        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes glitch {
            0% { text-shadow: 5px 4px 0px #ff00ff, -5px -4px 0px #00ffff; }
            50% { text-shadow: -3px 2px 0px #ff00ff, 3px -2px 0px #00ffff; }
            100% { text-shadow: 5px 4px 0px #ff00ff, -5px -4px 0px #00ffff; }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="container">
        <div class="astronaut">
            <div class="astronaut-body"></div>
        </div>
        <div class="error-code">404</div>
        <h1 class="message">这给我干哪来了 这还是国内吗！</h1>
        <a href="/" class="btn">返回HangChat</a>
        <div class="planet"></div>
    </div>

    <script>
        // 创建动态星星
        function createStars() {
            const stars = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.background = '#fff';
                star.style.borderRadius = '50%';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animation = `twinkle ${Math.random() * 3 + 2}s infinite`;
                stars.appendChild(star);
            }
        }

        // 添加鼠标跟随特效
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.container');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            container.style.transform = `perspective(1000px) 
                rotateX(${(y - 0.5) * 5}deg) 
                rotateY(${(x - 0.5) * 5}deg)`;
        });

        // 初始化
        createStars();
    </script>
</body>
</html>
